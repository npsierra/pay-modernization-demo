name: CBTRN02C COBOL vs Java

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: the job only checks out code and uploads an artifact.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache GnuCOBOL 3.2
        id: gnucobol-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/gnucobol
          key: gnucobol-3.2-${{ runner.os }}-${{ hashFiles('gnucobol/install-gnucobol.sh') }}

      - name: Install GnuCOBOL 3.2 (same version as Homebrew on macOS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp10 libdb5.3 libncurses6 libjson-c5
          gnucobol/install-gnucobol.sh /opt/gnucobol
          echo /opt/gnucobol/bin >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/gnucobol/lib" >> "$GITHUB_ENV"
          /opt/gnucobol/bin/cobc --version | head -1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and unit-test the Java port
        working-directory: java
        run: mvn -B package

      - name: Compare COBOL and Java outputs with the baseline (sample data)
        run: tests/compare-cbtrn02c.sh

      - name: Compare COBOL and Java outputs with the baseline (edge cases)
        run: tests/compare-cbtrn02c.sh tests/data/cbtrn02c-edge tests/golden/cbtrn02c-edge

      - name: Random batches, COBOL vs Java
        run: tests/fuzz-cbtrn02c.py 1 200

      - name: CBACT04C (interest) after CBTRN02C, COBOL and Java vs baseline
        run: tests/compare-cbact04c.sh

      - name: CBACT04C random batches, COBOL vs Java
        run: tests/fuzz-cbtrn02c.py 1 200 cbact04c

      - name: CBACT01C (account extract), COBOL and Java vs baseline
        run: |
          tests/compare-cbact01c.sh
          tests/compare-cbact01c.sh tests/data/cbact01c-edge tests/golden/cbact01c-edge
          tests/compare-cbact01c.sh tests/data/cbact01c-empty tests/golden/cbact01c-empty
          tests/compare-cbact01c.sh tests/data/cbact01c-abend tests/golden/cbact01c-abend 16

      - name: CBACT01C random account files, COBOL vs Java
        run: tests/fuzz-cbtrn02c.py 1 200 cbact01c

      - name: Keep outputs for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cbtrn02c-outputs
          path: |
            build/cbtrn02c-compare/
            build/cbact04c-compare/
            build/cbact01c-compare/
            build/cbtrn02c-fuzz/
          if-no-files-found: ignore
